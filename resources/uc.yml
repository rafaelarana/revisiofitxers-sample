resources:
  schemas:
    mvp_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "RevisioFitxers MVP — clasificación de documentos con Databricks AI Functions"

  volumes:
    raw_docs:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.mvp_schema.name}
